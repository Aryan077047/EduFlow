{% load static %}
<!DOCTYPE html>
<html lang="{{ lang|default:'en' }}" dir="{{ lang_dir|default:'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Course Player | Professional Learning Hub</title>

    <!-- 🌙 Dark mode — set theme BEFORE CSS loads -->
    <script>
    (function () {
        try {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/common.css' %}" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f4f7f1;
        }

        .player-container {
            min-height: 100vh;
            background: radial-gradient(circle at 0% 0%, rgba(127, 191, 91, 0.06), transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(47, 82, 51, 0.08), transparent 55%);
            padding: 1.5rem 2rem 2rem 2rem;
        }

        .player-nav {
            max-width: 1400px;
            margin: 0 auto 1.2rem auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.85);
            padding: 10px 22px;
            border-radius: 60px;
            color: #18311f;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.9);
            transition: background 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: white;
            box-shadow: 0 8px 20px rgba(47,82,51,0.15);
        }

        .course-badge {
            background: linear-gradient(135deg, #edf7e8, #e2efdb);
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #2f5233;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(93,156,89,0.2);
        }

        .video-player-card {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .video-wrapper {
            background: #0a0f0c;
            position: relative;
            width: 100%;
            cursor: pointer;
        }

        .video-element {
            width: 100%;
            display: block;
            background: #000;
            max-height: 75vh;
            object-fit: contain;
        }

        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            padding: 1rem 2rem 1.2rem 2rem;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        .video-wrapper.controls-idle .custom-controls {
            opacity: 0;
        }

        .video-wrapper:hover .custom-controls,
        .video-wrapper.controls-active .custom-controls {
            opacity: 1;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .control-btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.25);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: #5d9c59;
            border-color: transparent;
        }

        .skip-btn {
            width: 42px;
            height: 42px;
            font-size: 0.85rem;
            gap: 2px;
        }

        .time-display {
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: monospace;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 40px;
            user-select: none;
        }

        .progress-container {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .progress-container:hover {
            height: 9px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #a3e635, #5d9c59);
            border-radius: 12px;
            transition: width 0.05s linear;
            position: relative;
        }

        .progress-buffered {
            position: absolute;
            height: 100%;
            background: rgba(255,255,255,0.25);
            border-radius: 12px;
            width: 0%;
            pointer-events: none;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 40px;
        }

        .volume-box i {
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .volume-box i:hover {
            color: #a3e635;
        }

        .volume-slider {
            width: 85px;
            height: 4px;
            border-radius: 5px;
            cursor: pointer;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #a3e635;
            border-radius: 50%;
            cursor: pointer;
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.18);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-btn:hover {
            background: #5d9c59;
        }

        .video-info-section {
            padding: 2rem 2.5rem;
            background: linear-gradient(135deg, #ffffff, #f8fcf5);
        }

        .player-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #18311f;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .meta-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 0.5rem 0 1.2rem 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(93,156,89,0.2);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4c6b55;
            background: #f0f6ec;
            padding: 6px 14px;
            border-radius: 40px;
        }

        .meta-item i {
            color: #5d9c59;
        }

        .desc-text {
            color: #2a3a2e;
            font-size: 1rem;
            line-height: 1.65;
            margin-bottom: 2rem;
            background: #ffffff;
            padding: 1.3rem 1.6rem;
            border-radius: 24px;
            border: 1px solid #eef3e9;
        }

        .instructor-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 1rem 1.8rem;
            border-radius: 80px;
            margin-top: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(47,82,51,0.08);
            border: 1px solid rgba(127,191,91,0.2);
        }

        .instructor-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a3e635;
        }

        .instructor-details h4 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #18311f;
        }

        .instructor-details p {
            font-size: 0.8rem;
            color: #7d8f82;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.8rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .share-btn {
            background: transparent;
            border: 1.5px solid #5d9c59;
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #2f5233;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .share-btn:hover {
            background: #5d9c59;
            color: white;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(24,49,31,0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.3s ease;
            border: 1px solid rgba(163,230,53,0.3);
            white-space: nowrap;
            pointer-events: none;
        }
        .toast-msg.show {
            transform: translateX(-50%) translateY(0px);
        }

        @media (max-width: 768px) {
            .player-container { padding: 1rem; }
            .video-info-section { padding: 1.2rem; }
            .player-title { font-size: 1.4rem; }
            .controls-row { gap: 0.5rem; }
            .volume-slider { width: 55px; }
            .control-btn { width: 38px; height: 38px; }
            .skip-btn { width: 36px; height: 36px; }
            .toast-msg { font-size: 0.75rem; padding: 8px 16px; }
        }

        /* ============================================================
           🌙 DARK MODE OVERRIDES
           ============================================================ */
        [data-theme="dark"] body {
            background: #0d1510 !important;
        }

        [data-theme="dark"] .player-container {
            background:
                radial-gradient(circle at 0% 0%, rgba(127,191,91,.04), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(47,82,51,.06), transparent 55%),
                #0d1510 !important;
        }

        [data-theme="dark"] .back-btn {
            background: #16201a !important;
            border-color: #263a2e !important;
            color: #e4ede6 !important;
        }

        [data-theme="dark"] .back-btn:hover {
            background: #1f2c24 !important;
            box-shadow: 0 8px 20px rgba(0,0,0,.4) !important;
        }

        [data-theme="dark"] .course-badge {
            background: linear-gradient(135deg, #1f3327, #253a2b) !important;
            color: #a5d6a7 !important;
            border-color: #2f4638 !important;
        }

        [data-theme="dark"] .video-player-card {
            background: #16201a !important;
            border-color: #263a2e !important;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,.6) !important;
        }

        [data-theme="dark"] .video-info-section {
            background: linear-gradient(135deg, #16201a, #14201a) !important;
        }

        [data-theme="dark"] .player-title {
            color: #e4ede6 !important;
        }

        [data-theme="dark"] .meta-strip {
            border-bottom-color: #2f4638 !important;
        }

        [data-theme="dark"] .meta-item {
            background: #1f3327 !important;
            color: #a5d6a7 !important;
        }

        [data-theme="dark"] .meta-item i {
            color: #81c784 !important;
        }

        [data-theme="dark"] .desc-text {
            background: #1b2620 !important;
            color: #c9d6cc !important;
            border-color: #2f4638 !important;
        }

        [data-theme="dark"] .instructor-card {
            background: #1b2620 !important;
            border-color: #2f4638 !important;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,.4) !important;
        }

        [data-theme="dark"] .instructor-details h4 {
            color: #e4ede6 !important;
        }

        [data-theme="dark"] .instructor-details p {
            color: #93a397 !important;
        }

        [data-theme="dark"] .instructor-avatar {
            border-color: #a3e635 !important;
        }

        [data-theme="dark"] .share-btn {
            border-color: #a3e635 !important;
            color: #a3e635 !important;
        }

        [data-theme="dark"] .share-btn:hover {
            background: #5d9c59 !important;
            color: #ffffff !important;
            border-color: #5d9c59 !important;
        }

        /* 🛡️ GPU safety — disable blur in dark mode */
        [data-theme="dark"] * {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="player-nav">
        <div class="back-btn" id="backToDashboardBtn">
            <i class="fas fa-arrow-left"></i> {{ t.back_to_dashboard }}
        </div>
        <div class="course-badge">
            <i class="fas fa-graduation-cap"></i> {{ t.interactive_learning }}
        </div>
    </div>

    <div class="video-player-card">
        <div class="video-wrapper" id="videoWrapper">
            <video id="courseVideo" class="video-element" preload="metadata">
                {% if data.vedio %}
                <source src="{{ data.vedio.url }}" type="video/mp4">
                {% endif %}
                Your browser does not support HTML5 video.
            </video>

            <div class="custom-controls" id="customControls">
                <div class="controls-row">
                    <button class="control-btn skip-btn" id="rewindBtn" title="Rewind 10 seconds (←)">
                        <i class="fas fa-backward-step"></i>
                    </button>
                    
                    <button class="control-btn" id="playPauseBtn">
                        <i class="fas fa-play"></i>
                    </button>
                    
                    <button class="control-btn skip-btn" id="forwardBtn" title="Forward 10 seconds (→)">
                        <i class="fas fa-forward-step"></i>
                    </button>
                    
                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                    
                    <div class="progress-container" id="progressBar">
                        <div class="progress-buffered" id="progressBuffered"></div>
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    
                    <div class="volume-box">
                        <i class="fas fa-volume-up" id="volumeIcon"></i>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.02" value="1">
                    </div>
                    
                    <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen (F)">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="video-info-section">
            <h2 class="player-title" id="videoTitle">{{ t.loading_course }}</h2>
            <div class="meta-strip">
                <div class="meta-item"><i class="fas fa-tag"></i> <span id="videoCategory">{{ t.category_label }}</span></div>
                <div class="meta-item"><i class="fas fa-eye"></i> <span id="viewCount">12.5K views</span></div>
                <div class="meta-item"><i class="fas fa-clock"></i> <span id="videoDuration">--:--</span></div>
            </div>
            <div class="desc-text" id="videoDescription">
                {{ t.description_placeholder }}
            </div>
            <div class="instructor-card">
                <img class="instructor-avatar" id="instructorImg" src="https://i.pravatar.cc/100?img=12" alt="Instructor">
                <div class="instructor-details">
                    <h4 id="instructorName">Sarah Johnson</h4>
                    <p><i class="fas fa-certificate"></i> {{ t.senior_instructor }}</p>
                </div>
            </div>
            <div class="action-row">
                <button class="share-btn" id="shareCourseBtn"><i class="fas fa-share-alt"></i> {{ t.share_course }}</button>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg">{{ t.link_copied }}</div>

<script>
    // ========== COMPLETE VIDEO PLAYER WITH FULL CONTROLS ==========
    
    const video = document.getElementById('courseVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressFill = document.getElementById('progressFill');
    const progressBuffered = document.getElementById('progressBuffered');
    const progressContainer = document.getElementById('progressBar');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeIcon = document.getElementById('volumeIcon');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const videoWrapper = document.getElementById('videoWrapper');
    const durationSpan = document.getElementById('videoDuration');
    
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            video_url: params.get('video_url'),
            title: params.get('title'),
            category: params.get('category'),
            description: params.get('description'),
            instructor: params.get('instructor'),
            instructor_img: params.get('instructor_img'),
            views: params.get('views')
        };
    }
    
    const urlData = getUrlParams();
    
    const metadata = {
        title: urlData.title ? decodeURIComponent(urlData.title) : 'Master Class: Professional Skills',
        category: urlData.category ? decodeURIComponent(urlData.category) : 'Development',
        description: urlData.description ? decodeURIComponent(urlData.description) : 'Learn advanced techniques and best practices from industry experts.',
        instructor: urlData.instructor ? decodeURIComponent(urlData.instructor) : 'Emily Richards',
        instructorImg: urlData.instructor_img ? decodeURIComponent(urlData.instructor_img) : 'https://randomuser.me/api/portraits/women/68.jpg',
        views: urlData.views ? decodeURIComponent(urlData.views) : '14.2K views'
    };
    
    document.getElementById('videoTitle').innerText = metadata.title;
    document.getElementById('videoCategory').innerText = metadata.category;
    document.getElementById('videoDescription').innerText = metadata.description;
    document.getElementById('instructorName').innerText = metadata.instructor;
    document.getElementById('instructorImg').src = metadata.instructorImg;
    document.getElementById('viewCount').innerText = metadata.views;
    
    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return "0:00";
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hrs > 0) return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        return `${mins}:${secs.toString().padStart(2,'0')}`;
    }
    
    function updateProgressAndTime() {
        if (video.duration && isFinite(video.duration)) {
            const current = formatTime(video.currentTime);
            const total = formatTime(video.duration);
            timeDisplay.innerText = `${current} / ${total}`;
            const percent = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${percent}%`;
            if (durationSpan.innerText === '--:--') {
                durationSpan.innerText = formatTime(video.duration);
            }
        } else {
            timeDisplay.innerText = `0:00 / 0:00`;
        }
        
        if (video.buffered.length > 0 && video.duration) {
            const bufferedEnd = video.buffered.end(video.buffered.length - 1);
            const bufferedPercent = (bufferedEnd / video.duration) * 100;
            progressBuffered.style.width = `${bufferedPercent}%`;
        }
    }
    
    function togglePlayPause() {
        if (video.paused || video.ended) {
            video.play().catch(e => console.log("Play error:", e));
        } else {
            video.pause();
        }
    }
    
    function rewindVideo() {
        video.currentTime = Math.max(0, video.currentTime - 10);
        showToast('⏪ Rewind 10 seconds');
    }
    
    function forwardVideo() {
        if (video.duration) {
            video.currentTime = Math.min(video.duration, video.currentTime + 10);
            showToast('⏩ Forward 10 seconds');
        }
    }
    
    function updateVolumeIcon() {
        if (video.volume === 0) {
            volumeIcon.className = 'fas fa-volume-mute';
        } else if (video.volume < 0.5) {
            volumeIcon.className = 'fas fa-volume-down';
        } else {
            volumeIcon.className = 'fas fa-volume-up';
        }
    }
    
    let idleTimer;
    function resetIdleTimer() {
        videoWrapper.classList.remove('controls-idle');
        videoWrapper.classList.add('controls-active');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            if (!video.paused) {
                videoWrapper.classList.add('controls-idle');
            }
            videoWrapper.classList.remove('controls-active');
        }, 2500);
    }
    
    function initIdleControls() {
        videoWrapper.addEventListener('mousemove', resetIdleTimer);
        videoWrapper.addEventListener('click', resetIdleTimer);
        videoWrapper.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();
        video.addEventListener('play', resetIdleTimer);
        video.addEventListener('pause', () => {
            videoWrapper.classList.remove('controls-idle');
            videoWrapper.classList.add('controls-active');
            clearTimeout(idleTimer);
        });
    }
    
    const toast = document.getElementById('toastMsg');
    function showToast(message) {
        toast.innerText = message || '✨ Done!';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    video.addEventListener('play', () => {
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
    });
    video.addEventListener('pause', () => {
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
    });
    video.addEventListener('timeupdate', updateProgressAndTime);
    video.addEventListener('loadedmetadata', () => {
        updateProgressAndTime();
        if (video.duration && isFinite(video.duration)) {
            durationSpan.innerText = formatTime(video.duration);
        }
    });
    video.addEventListener('progress', updateProgressAndTime);
    
    video.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlayPause();
        resetIdleTimer();
    });
    
    playPauseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlayPause();
        resetIdleTimer();
    });
    
    rewindBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        rewindVideo();
        resetIdleTimer();
    });
    
    forwardBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        forwardVideo();
        resetIdleTimer();
    });
    
    let isSeeking = false;
    progressContainer.addEventListener('mousedown', (e) => {
        isSeeking = true;
        const rect = progressContainer.getBoundingClientRect();
        let pos = (e.clientX - rect.left) / rect.width;
        pos = Math.min(1, Math.max(0, pos));
        if (video.duration && isFinite(video.duration)) {
            video.currentTime = pos * video.duration;
        }
        resetIdleTimer();
    });
    
    window.addEventListener('mousemove', (e) => {
        if (isSeeking) {
            const rect = progressContainer.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.min(1, Math.max(0, pos));
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = pos * video.duration;
                updateProgressAndTime();
            }
            resetIdleTimer();
        }
    });
    
    window.addEventListener('mouseup', () => {
        isSeeking = false;
    });
    
    volumeSlider.addEventListener('input', (e) => {
        video.volume = parseFloat(e.target.value);
        updateVolumeIcon();
    });
    
    volumeIcon.addEventListener('click', () => {
        if (video.volume > 0) {
            video.volume = 0;
            volumeSlider.value = 0;
        } else {
            video.volume = 0.8;
            volumeSlider.value = 0.8;
        }
        updateVolumeIcon();
        showToast(`Volume: ${Math.round(video.volume * 100)}%`);
    });
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            videoWrapper.requestFullscreen().catch(err => console.warn(err));
        } else {
            document.exitFullscreen();
        }
    }
    
    fullscreenBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFullscreen();
        resetIdleTimer();
    });
    
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
        } else {
            fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
        }
    });
    
    window.addEventListener('keydown', (e) => {
        const tag = e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
        
        switch(e.code) {
            case 'Space':
                e.preventDefault();
                togglePlayPause();
                resetIdleTimer();
                break;
            case 'ArrowLeft':
                e.preventDefault();
                rewindVideo();
                resetIdleTimer();
                break;
            case 'ArrowRight':
                e.preventDefault();
                forwardVideo();
                resetIdleTimer();
                break;
            case 'ArrowUp':
                e.preventDefault();
                video.volume = Math.min(1, video.volume + 0.1);
                volumeSlider.value = video.volume;
                updateVolumeIcon();
                showToast(`Volume: ${Math.round(video.volume * 100)}%`);
                break;
            case 'ArrowDown':
                e.preventDefault();
                video.volume = Math.max(0, video.volume - 0.1);
                volumeSlider.value = video.volume;
                updateVolumeIcon();
                showToast(`Volume: ${Math.round(video.volume * 100)}%`);
                break;
            case 'KeyF':
                e.preventDefault();
                toggleFullscreen();
                break;
            case 'KeyM':
                e.preventDefault();
                if (video.volume > 0) {
                    video.volume = 0;
                    volumeSlider.value = 0;
                } else {
                    video.volume = 0.8;
                    volumeSlider.value = 0.8;
                }
                updateVolumeIcon();
                showToast(video.volume === 0 ? '🔇 Muted' : '🔊 Unmuted');
                break;
        }
    });
    
    const backBtn = document.getElementById('backToDashboardBtn');
    backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (document.referrer && document.referrer.includes(window.location.host)) {
            window.history.back();
        } else {
            window.location.href = '/';
        }
    });
    
    const shareBtn = document.getElementById('shareCourseBtn');
    shareBtn.addEventListener('click', () => {
        const shareUrl = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('🔗 Course link copied!');
            }).catch(() => {
                showToast('📋 Press Ctrl+C to copy');
            });
        } else {
            showToast('📋 Press Ctrl+C to copy link');
        }
    });
    
    video.volume = 1;
    volumeSlider.value = 1;
    updateVolumeIcon();
    initIdleControls();
    
    video.addEventListener('error', () => {
        console.warn('Video source error');
        showToast('⚠️ Video loading failed');
    });
    
    console.log('Video player ready');
</script>

</body>
</html>
