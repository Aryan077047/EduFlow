<!DOCTYPE html>
<html lang="{{ lang|default:'en' }}" dir="{{ lang_dir|default:'ltr' }}">

{% include 'head.html' %}

<body class="text-{{ lang_dir|default:'ltr' }}">

    {% block header %}
        {% include 'header.html' %}
    {% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
        {% include 'footer.html' %}
    {% endblock %}

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" media="print" onload="this.media='all'">


    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common JS -->

    <!-- Page-specific JS -->
    {% block extra_js %}{% endblock %}

</body>
</html>
