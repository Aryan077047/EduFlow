{% load static %}

<!-- ====================== PROFESSIONAL GREEN HEADER ====================== -->

<header class="main-header">
    <div class="container-fluid px-3 px-xl-4">
        <div class="header-inner">

            <!-- LEFT -->
            <div class="left-section">
                <!-- 🔴 NEW LOGO: EduFlow brand mark -->
                <a href="{% url 'index' %}" class="logo-link">
                    <div class="logo-mark">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h2 class="logo-text">Edu<span>Flow</span></h2>
                </a>

                <button class="mobile-menu-btn d-md-none" id="mobileMenuBtn">
                    <i class="fa fa-bars"></i>
                </button>
            </div>

            <!-- SEARCH -->
            <div class="search-wrapper d-none d-lg-block">
                <div class="search-box">
                    <i class="fa fa-search search-icon"></i>
                    <input type="text"
                           id="globalSearch"
                           placeholder="Search courses, videos..."
                           class="search-input">
                </div>
            </div>

            <!-- RIGHT -->
            <div class="header-actions">

                {% if request.user.is_authenticated %}
                <a href="{% url 'ai_assistant' %}" class="action-btn" title="AI Study Assistant">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </a>
                {% endif %}

                <!-- 🌙 Dark Mode Toggle -->
                <button class="action-btn" id="themeToggle" title="Toggle dark mode">
                    <i class="fa fa-moon" id="themeIcon"></i>
                </button>

                <!-- Fullscreen -->
                <button onclick="toggleFullscreen()" class="action-btn" title="Fullscreen">
                    <i class="fa fa-expand"></i>
                </button>

                <!-- Notifications -->
                <button class="action-btn has-badge" id="notifBtn">
                    <i class="fa fa-bell"></i>
                    <span class="badge-dot"></span>
                </button>

                <!-- Messages -->
                <button class="action-btn has-badge" id="msgBtn">
                    <i class="fa fa-envelope"></i>
                    <span class="badge-count">5</span>
                </button>

                <!-- PROFILE -->
                {% if request.user.is_authenticated %}
                <div class="profile-dropdown">
                    <button class="profile-btn" id="profileBtn">
                        <img src="{% if profile_img and profile_img.picture %}{{ profile_img.picture.url }}{% else %}{% static 'dist-assets/images/newlogo.png' %}{% endif %}"
                             alt="Profile"
                             class="profile-img"
                             onerror="this.src='{% static 'dist-assets/images/newlogo.png' %}'">

                        <div class="profile-info d-none d-lg-block">
                            <span class="profile-name">
                                {{ request.user.first_name|default:request.user.email }}
                            </span>
                            <span class="profile-role">
                                {% if request.user.role == 'teacher' %}Teacher{% else %}Student{% endif %}
                            </span>
                        </div>

                        <i class="fa fa-chevron-down profile-arrow"></i>
                    </button>

                    <!-- Dropdown -->
                    <div class="profile-menu" id="profileMenu">
                        <a href="{% url 'user_profile' %}" class="profile-menu-item">
                            <i class="fa fa-user"></i> My Profile
                        </a>
                        <a href="{% url 'user_profile' %}#courseList" class="profile-menu-item">
                            <i class="fa fa-book"></i> My Courses
                        </a>
                        <a href="{% url 'ai_assistant' %}" class="profile-menu-item">
                            <i class="fa fa-wand-magic-sparkles"></i> AI Assistant
                        </a>
                        <a href="{% url 'setting' %}" class="profile-menu-item">
                            <i class="fa fa-gear"></i> Settings
                        </a>
                        <div class="profile-divider"></div>
                        <a href="{% url 'user_logout' %}" class="profile-menu-item logout-item">
                            <i class="fa fa-right-from-bracket"></i> Logout
                        </a>
                    </div>
                </div>

                {% else %}
                <!-- LOGIN -->
                <a href="{% url 'user_login' %}" class="login-btn">
                    <i class="fa fa-user-lock"></i>
                    <span>Login</span>
                </a>
                {% endif %}

            </div>
        </div>
    </div>
</header>

<!-- ====================== STYLES ====================== -->
<style>
:root {
    --primary-dark: #18311f;
    --deep-green: #2f5233;
    --light-green: #5d9c59;
    --accent-green: #7fbf5b;
    --bg-light: #f3f8f1;
    --text-light: #7d8f82;
    --red-1: #dc2626;

    --card: #ffffff;
    --surface: #edf7e8;
    --surface-2: #dff2d7;
    --line: #d5e8ce;
    --line-soft: #e7f0e4;
    --placeholder: #6f8b73;
    --badge-border: #ffffff;
}

[data-theme="dark"] {
    --primary-dark: #e4ede6;
    --deep-green: #4a7a52;
    --light-green: #6fb56a;
    --accent-green: #a3e635;
    --bg-light: #0d1510;
    --text-light: #93a397;
    --red-1: #ef4444;

    --card: #16201a;
    --surface: #1b2620;
    --surface-2: #1f2c24;
    --line: #263a2e;
    --line-soft: #2f4638;
    --placeholder: #6d7f72;
    --badge-border: #16201a;
}

/* ====================== BODY ====================== */
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:
        radial-gradient(circle at top right, rgba(16, 43, 1, .10), transparent 25%),
        radial-gradient(circle at bottom left, rgba(4, 64, 11, .08), transparent 30%),
        var(--bg-light);
    min-height: 100vh;
}

/* ====================== HEADER ====================== */
.main-header {
    position: sticky;
    top: 0;
    z-index: 1030;
    background: var(--deep-green);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 24px rgba(78, 209, 115, .05);
    transition: background .3s ease, box-shadow .3s ease;
}
.main-header.scrolled {
    background: rgba(255, 255, 255, .94);
    box-shadow: 0 10px 30px rgba(28, 56, 36, .08);
}
[data-theme="dark"] .main-header.scrolled {
    background: rgba(13, 21, 16, .94);
}

/* ====================== INNER ====================== */
.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 0;
}

/* ====================== LEFT ====================== */
.left-section {
    display: flex;
    align-items: center;
    gap: 14px;
}

/* ====================== LOGO ====================== */
.logo-link {
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
}
.logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent-green), #a3e635);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    color: var(--deep-green);
    box-shadow: 0 4px 12px rgba(163, 230, 53, .25);
    flex-shrink: 0;
}
.logo-text {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -.3px;
    color: #ffffff;
    margin: 0;
    line-height: 1;
}
.logo-text span { color: var(--accent-green); }

/* When header is scrolled (light bg), text needs to be dark */
.main-header.scrolled .logo-text { color: var(--primary-dark); }
[data-theme="dark"] .main-header.scrolled .logo-text { color: var(--primary-dark); }

/* ====================== MOBILE MENU ====================== */
.mobile-menu-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--surface);
    color: var(--deep-green);
    font-size: 1rem;
    transition: background .25s ease;
    cursor: pointer;
}
.mobile-menu-btn:hover { background: var(--surface-2); }

/* ====================== SEARCH ====================== */
.search-wrapper {
    flex: 1;
    max-width: 480px;
}
.search-box { position: relative; }
.search-input {
    width: 100%;
    height: 48px;
    border-radius: 14px;
    padding: 0 18px 0 48px;
    background: rgba(255, 255, 255, .78);
    border: 1px solid var(--line);
    color: var(--primary-dark);
    font-size: .90rem;
    font-family: inherit;
    transition: border-color .25s ease, background .25s ease, box-shadow .25s ease;
}
.search-input:focus {
    outline: none;
    background: var(--card);
    border-color: var(--accent-green);
    box-shadow: 0 0 0 4px rgba(127, 191, 91, .12);
}
.search-input::placeholder { color: var(--placeholder); }
.search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--placeholder);
    font-size: .95rem;
}

/* ====================== ACTIONS ====================== */
.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}
.action-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: #46624d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .95rem;
    position: relative;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
    cursor: pointer;
}
.action-btn:hover {
    background: var(--surface);
    color: var(--primary-dark);
    box-shadow: 0 8px 16px rgba(34, 197, 94, .10);
}

/* ====================== BADGES ====================== */
.badge-dot {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red-1);
    border: 2px solid var(--badge-border);
}
.badge-count {
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 17px;
    height: 17px;
    border-radius: 30px;
    background: var(--red-1);
    color: white;
    font-size: .55rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--badge-border);
}

/* ====================== LOGIN ====================== */
.login-btn {
    height: 42px;
    padding: 0 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--light-green), var(--deep-green));
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .84rem;
    font-weight: 700;
    box-shadow: 0 6px 18px rgba(47, 82, 51, .15);
    transition: box-shadow .25s ease;
}
.login-btn i { font-size: .95rem; }
.login-btn:hover {
    color: white;
    box-shadow: 0 10px 20px rgba(47, 82, 51, .20);
}

/* ====================== PROFILE ====================== */
.profile-dropdown { position: relative; }

.profile-btn {
    height: 46px;
    background: rgba(255, 255, 255, .82);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0 14px 0 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background .25s ease, box-shadow .25s ease;
}
.profile-btn:hover {
    background: var(--surface);
    box-shadow: 0 8px 18px rgba(34, 197, 94, .10);
}
.profile-img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--line-soft);
}
.profile-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.2;
}
.profile-name {
    font-size: .82rem;
    font-weight: 700;
    color: var(--primary-dark);
}
.profile-role {
    font-size: .70rem;
    color: var(--text-light);
}
.profile-arrow {
    font-size: .72rem;
    color: var(--placeholder);
}

/* ====================== DROPDOWN ====================== */
.profile-menu {
    position: absolute;
    top: 58px;
    right: 0;
    width: 230px;
    background: var(--card);
    border-radius: 18px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 35px rgba(29, 53, 36, .10);
    padding: 10px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity .25s ease, visibility .25s ease, transform .25s ease;
}
.profile-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
.profile-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 14px;
    border-radius: 12px;
    text-decoration: none;
    color: #36513d;
    font-size: .84rem;
    font-weight: 600;
    transition: background .2s ease, color .2s ease;
}
.profile-menu-item:hover {
    background: var(--surface);
    color: var(--primary-dark);
}
.profile-divider {
    height: 1px;
    background: var(--line-soft);
    margin: 8px 0;
}
.logout-item { color: var(--red-1); }

/* ====================== RESPONSIVE ====================== */
@media (max-width: 992px) {
    .search-wrapper { display: none; }
    .profile-info,
    .profile-arrow,
    .login-btn span { display: none; }
    .profile-btn,
    .login-btn {
        width: 42px;
        padding: 0;
        justify-content: center;
    }
}
@media (max-width: 576px) {
    .header-inner { gap: 12px; }
    .logo-mark { width: 34px; height: 34px; font-size: .95rem; }
    .logo-text { font-size: 1rem; }
    .action-btn,
    .mobile-menu-btn,
    .login-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
    }
    .profile-btn {
        height: 40px;
        border-radius: 12px;
    }
    .profile-img {
        width: 30px;
        height: 30px;
    }
}
</style>

<!-- ====================== JAVASCRIPT ====================== -->
<script>
(function () {
    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    if (!btn) return;

    function updateIcon() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (icon) icon.className = isDark ? 'fa fa-sun' : 'fa fa-moon';
    }
    updateIcon();

    btn.addEventListener('click', function () {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
    });
})();

/* Fullscreen toggle */
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

/* Scroll → toggle .scrolled class */
window.addEventListener('scroll', function () {
    var header = document.querySelector('.main-header');
    if (!header) return;
    header.classList.toggle('scrolled', window.scrollY > 50);
});

/* Search keyboard shortcut: Ctrl/Cmd + K */
document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        var s = document.getElementById('globalSearch');
        if (s) s.focus();
    }
});

/* Profile dropdown */
(function () {
    var profileBtn = document.getElementById('profileBtn');
    var profileMenu = document.getElementById('profileMenu');
    if (!profileBtn || !profileMenu) return;

    profileBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        profileMenu.classList.toggle('active');
    });

    document.addEventListener('click', function (e) {
        if (!profileBtn.contains(e.target) && !profileMenu.contains(e.target)) {
            profileMenu.classList.remove('active');
        }
    });
})();
</script>
