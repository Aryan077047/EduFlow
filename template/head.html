{% load static %}

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>{% block title %}Dashboard{% endblock %}</title>

    <!-- 🌙 Dark mode — set theme BEFORE CSS loads (prevents flash) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute(
                    'data-theme',
                    saved || (prefersDark ? 'dark' : 'light')
                );
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:300,400,600,700" rel="stylesheet" />

    <!-- 🌙 Dark mode theme — MUST come before other CSS -->
    <link href="{% static 'css/theme.css' %}" rel="stylesheet" />

    <!-- Main CSS -->
    <link href="{% static 'dist-assets/css/themes/lite-purple.css' %}" rel="stylesheet" />
    <link href="{% static 'dist-assets/css/plugins/perfect-scrollbar.css' %}" rel="stylesheet" />
    <link href="{% static 'dist-assets/css/plugins/metisMenu.min.css' %}" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
